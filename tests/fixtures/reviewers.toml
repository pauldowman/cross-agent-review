# Routing fixture for the test suite. Tests that care about routing install
# their own harnesses and override this with a catch-all.

[[rule]]
pattern = "^claude"
reviewers = [
    { harness = "codex", model = "gpt-5.6-sol", effort = "medium" },
    { harness = "opencode", model = "opencode/x-preview-f-free", effort = "medium" },
]

[[rule]]
pattern = "^gpt|^codex"
reviewers = [
    { harness = "claude", model = "claude-opus-5", effort = "medium" },
    { harness = "opencode", model = "opencode/x-preview-f-free", effort = "medium" },
    { harness = "omp", model = "vendor/x-preview-m", effort = "medium" },
]

[[rule]]
pattern = "."
reviewers = [
    { harness = "codex", model = "gpt-5.6-sol", effort = "medium" },
    { harness = "claude", model = "claude-opus-5", effort = "medium" },
]
