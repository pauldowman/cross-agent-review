# Routing fixture for the test suite. Tests that care about routing install
# their own harnesses and override this with a catch-all.

[[rule]]
pattern = "^claude"
reviewers = [
    { harness = "codex", model = "gpt-5.6-sol" },
    { harness = "opencode", model = "opencode/x-preview-f-free" },
]

[[rule]]
pattern = "^gpt|^codex"
reviewers = [
    { harness = "claude", model = "claude-opus-5" },
    { harness = "opencode", model = "opencode/x-preview-f-free" },
]

[[rule]]
pattern = "."
reviewers = [
    { harness = "codex", model = "gpt-5.6-sol" },
    { harness = "claude", model = "claude-opus-5" },
]
